<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Hello, World!</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 2rem; color: #f8f7ff; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: radial-gradient(circle at 85% 75%, #6e69ff 0, transparent 28rem), linear-gradient(135deg, #171330, #332567 52%, #101b46); }
    main { width: min(92vw, 620px); padding: clamp(2rem, 7vw, 4.5rem); text-align: center; background: rgba(24, 22, 55, .6); border: 1px solid rgba(255,255,255,.18); border-radius: 30px; box-shadow: 0 25px 80px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
    nav { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.5rem; } nav a { color: #c9c6e8; text-decoration: none; font-weight: 650; } nav a:hover, nav a[aria-current="page"] { color: white; }
    h1 { margin: 0 0 .7rem; font-size: clamp(2.8rem, 8vw, 5rem); letter-spacing: -.06em; } p { color: #d8d5ee; line-height: 1.7; }
    form { display: grid; gap: .9rem; margin-top: 1.6rem; text-align: left; } label { font-size: .9rem; color: #d8d5ee; } input, textarea { width: 100%; margin-top: .35rem; padding: .8rem; border: 1px solid rgba(255,255,255,.22); border-radius: 10px; color: white; font: inherit; background: rgba(255,255,255,.08); } textarea { min-height: 100px; resize: vertical; } button { justify-self: center; margin-top: .4rem; padding: .8rem 1.35rem; border: 0; border-radius: 999px; cursor: pointer; color: #231b4a; font: inherit; font-weight: 750; background: linear-gradient(135deg, #fff3a6, #ffbce0); }
  </style>
</head>
<body>
  <main>
    <nav aria-label="Main navigation"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html" aria-current="page">Contact</a></nav>
    <h1>Let’s connect</h1>
    <p>Have an idea or a question? Send a note below.</p>
    <form id="contact-form">
      <label>Your name<input required type="text" name="name" placeholder="Jane Doe"></label>
      <label>Your email<input required type="email" name="email" placeholder="you@example.com"></label>
      <label>Your message<textarea required name="message" placeholder="Write your message here..."></textarea></label>
      <button type="submit">Send message</button>
    </form>
  </main>
  <script>
    document.querySelector('#contact-form').addEventListener('submit', event => {
      event.preventDefault();
      event.currentTarget.innerHTML = '<p role="status">Thanks for reaching out! Your message is ready to send. ✨</p>';
    });
  </script>
</body>
</html>
