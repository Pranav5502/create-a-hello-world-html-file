<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A cheerful Hello, World! page.">
  <title>Hello, World!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8f7ff;
      --muted: #c9c6e8;
      --glass: rgba(24, 22, 55, 0.58);
      --line: rgba(255, 255, 255, 0.18);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 20%, #ff7a9e 0, transparent 27rem),
        radial-gradient(circle at 83% 78%, #6e69ff 0, transparent 30rem),
        linear-gradient(135deg, #171330, #332567 52%, #101b46);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(3px);
      opacity: 0.72;
      animation: drift 10s ease-in-out infinite alternate;
    }

    .orb.one { width: 9rem; height: 9rem; top: 10%; right: 16%; background: #ffcb77; }
    .orb.two { width: 5rem; height: 5rem; bottom: 13%; left: 13%; background: #79e4ff; animation-delay: -4s; }

    main {
      position: relative;
      width: min(92vw, 720px);
      padding: clamp(2rem, 7vw, 5rem);
      text-align: center;
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: 30px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(18px);
      animation: rise 800ms cubic-bezier(.2,.8,.2,1) both;
    }

    nav { display: flex; justify-content: center; gap: 1rem; margin-bottom: 2.3rem; }
    nav a { color: var(--muted); text-decoration: none; font-weight: 650; transition: color 180ms ease; }
    nav a:hover, nav a[aria-current="page"] { color: #fff; }

    .badge {
      display: inline-flex;
      gap: 0.5rem;
      align-items: center;
      padding: 0.5rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.9rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .badge::before { content: "✦"; color: #ffd675; }

    h1 {
      margin: 1.4rem 0 0.8rem;
      font-size: clamp(3rem, 10vw, 6.8rem);
      line-height: 0.95;
      letter-spacing: -0.075em;
      background: linear-gradient(100deg, #fff, #ffd4eb 43%, #9aeaff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    p { margin: 0 auto; max-width: 39rem; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); line-height: 1.7; }

    button {
      margin-top: 2rem;
      padding: 0.85rem 1.25rem;
      border: 0;
      border-radius: 999px;
      color: #231b4a;
      background: linear-gradient(135deg, #fff3a6, #ffbce0);
      box-shadow: 0 10px 30px rgba(255, 177, 215, 0.27);
      cursor: pointer;
      font: inherit;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 14px 36px rgba(255, 177, 215, 0.4); }
    button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

    @keyframes rise { from { opacity: 0; transform: translateY(25px) scale(.97); } to { opacity: 1; transform: none; } }
    @keyframes drift { to { transform: translate(28px, -24px) scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; } }
  </style>
</head>
<body>
  <div class="orb one" aria-hidden="true"></div>
  <div class="orb two" aria-hidden="true"></div>
  <main>
    <nav aria-label="Main navigation">
      <a href="index.html" aria-current="page">Home</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <span class="badge">A tiny web beginning</span>
    <h1>Hello, World!</h1>
    <p>Welcome to your first beautifully simple web page. It is responsive, accessible, and ready for your next idea.</p>
    <button type="button" id="greet">Say hello back</button>
  </main>
  <script>
    const button = document.querySelector('#greet');
    button.addEventListener('click', () => {
      button.textContent = 'Hello right back! ✨';
      button.setAttribute('aria-label', 'Greeting sent');
    });
  </script>
</body>
</html>
